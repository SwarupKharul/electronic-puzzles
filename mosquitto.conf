# Mosquitto 2.x config for the escape room broker.
# Run:  mosquitto -c mosquitto.conf -v

# Plain MQTT for the ESP32 props
listener 1883 0.0.0.0
protocol mqtt

# MQTT over WebSocket for the browser dashboard (mqtt.js)
listener 9001 0.0.0.0
protocol websockets

# LAN-only show network, so no auth. Add a password_file if the Wi-Fi is shared.
allow_anonymous true

# Keep retained messages (state/status) across broker restarts
persistence true
persistence_location ./mosquitto-data/
